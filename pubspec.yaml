name: mindwell
description: "Mindwell - A mindful journaling and mental wellness mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.7.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^16.2.1

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  mindwell_api:
    path: api/

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0-beta.4

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  photo_view: ^0.15.0
  shimmer: ^3.0.0

  # HTML Rendering
  flutter_html: ^3.0.0
  url_launcher: ^6.2.5
  
  # Rich Text Editor
  flutter_quill: ^11.4.2
  dart_quill_delta: ^10.8.3

  # Dependency Injection
  injectable: ^2.3.2
  get_it: ^8.2.0

  # Data Classes & JSON
  freezed_annotation: ^2.4.1
  built_collection: ^5.1.1

  # Internationalization & Formatting
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Logging
  logging: ^1.2.0

  # WebSocket
  centrifuge: ^0.16.0

  # Utilities
  equatable: ^2.0.5
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1

  # Testing
  integration_test:
    sdk: flutter
  mocktail: ^1.0.1
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  # Internationalization
  generate: true

  # Add assets directory for images, icons, etc.
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Add custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
