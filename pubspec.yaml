name: mindwell
description: "Mindwell - A mindful journaling and mental wellness mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_staggered_grid_view: ^0.6.2

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5

  # Dependency Injection
  injectable: ^2.3.2
  get_it: ^7.6.4

  # Data Classes & JSON
  freezed_annotation: ^2.4.1

  # Internationalization & Formatting
  intl: ^0.19.0

  # Logging
  logging: ^1.2.0

  # WebSocket
  centrifuge: ^0.16.0

  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  riverpod_generator: ^2.3.9
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1

  # Testing
  integration_test:
    sdk: flutter
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  # Add assets directory for images, icons, etc.
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Add custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
